<h2 mat-dialog-title>
  {{ data.mode === 'create' ? 'Create Subtask' : 'Edit Subtask' }}
</h2>

<mat-dialog-content>
  <!-- CREATE MODE: Simple form without tabs -->
  <div *ngIf="data.mode === 'create'" class="simple-form">
    <form [formGroup]="form" class="form-container">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" placeholder="Enter subtask description">
        <mat-error *ngIf="form.get('description')?.hasError('required')">
          Description is required
        </mat-error>
        <mat-error *ngIf="form.get('description')?.hasError('minlength')">
          Minimum 3 characters
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option [value]="SubTaskStatus.Pending">Pending</mat-option>
          <mat-option [value]="SubTaskStatus.Completed">Completed</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Due Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="dueDate">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Notes</mat-label>
        <textarea matInput formControlName="notes" placeholder="Additional notes" rows="3"></textarea>
      </mat-form-field>

      <div *ngIf="error()" class="error-message">
        {{ error() }}
      </div>
    </form>
  </div>

  <!-- EDIT MODE: Tabs with Subtask Info and History -->
  <mat-tab-group *ngIf="data.mode === 'edit' && data.subTask">
    <!-- Tab 1: Subtask Info -->
    <mat-tab label="Subtask Info">
      <div class="tab-content">
        <form [formGroup]="form" class="form-container">
          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Description</mat-label>
            <input matInput formControlName="description" placeholder="Enter subtask description">
            <mat-error *ngIf="form.get('description')?.hasError('required')">
              Description is required
            </mat-error>
            <mat-error *ngIf="form.get('description')?.hasError('minlength')">
              Minimum 3 characters
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
              <mat-option [value]="SubTaskStatus.Pending">Pending</mat-option>
              <mat-option [value]="SubTaskStatus.Completed">Completed</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Due Date</mat-label>
            <input matInput [matDatepicker]="picker2" formControlName="dueDate">
            <mat-datepicker-toggle matSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="fill" class="full-width">
            <mat-label>Notes</mat-label>
            <textarea matInput formControlName="notes" placeholder="Additional notes" rows="3"></textarea>
          </mat-form-field>

          <div *ngIf="error()" class="error-message">
            {{ error() }}
          </div>
        </form>
      </div>
    </mat-tab>

    <!-- Tab 2: History -->
    <mat-tab label="History">
      <div class="tab-content">
        <app-subtask-history-list [subTaskId]="data.subTask.subTaskId"></app-subtask-history-list>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || loading()">
    <mat-spinner diameter="20" *ngIf="loading()"></mat-spinner>
    <span *ngIf="!loading()">{{ data.mode === 'create' ? 'Create' : 'Update' }}</span>
  </button>
</mat-dialog-actions>
