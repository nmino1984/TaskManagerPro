<div class="subtask-container">
  <div class="subtask-header">
    <button mat-raised-button color="primary" (click)="openCreateDialog()" class="add-btn">
      <mat-icon>add</mat-icon>
      Add
    </button>
  </div>

  <div *ngIf="loading()" class="loading">
    <p>Loading subtasks...</p>
  </div>

  <div *ngIf="!loading() && subTasks().length === 0" class="no-data">
    <p>No subtasks yet</p>
  </div>

  <table mat-table [dataSource]="subTasks()" *ngIf="!loading() && subTasks().length > 0" class="subtask-table">
    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{ element.description }}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <mat-chip [color]="getStatusColor(element.status)" selected>
          {{ element.status }}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Due Date Column -->
    <ng-container matColumnDef="dueDate">
      <th mat-header-cell *matHeaderCellDef>Due Date</th>
      <td mat-cell *matCellDef="let element">{{ formatDate(element.dueDate) }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="editSubTask(element)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteSubTask(element)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
