<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Create New Task' : 'Edit Task' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" required>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Start Date</mat-label>
      <input matInput [matDatepicker]="startPicker" formControlName="startDate">
      <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>End Date</mat-label>
      <input matInput [matDatepicker]="endPicker" formControlName="endDate">
      <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        <mat-option value="Low">Low</mat-option>
        <mat-option value="Medium">Medium</mat-option>
        <mat-option value="High">High</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option [value]="MyTaskStatus.NotStarted">Not Started</mat-option>
        <mat-option [value]="MyTaskStatus.InProgress">In Progress</mat-option>
        <mat-option [value]="MyTaskStatus.Completed">Completed</mat-option>
        <mat-option [value]="MyTaskStatus.Overdue">Overdue</mat-option>
      </mat-select>
    </mat-form-field>
  </form>

  <!-- Subtasks Section (only shown in edit mode) -->
  <mat-divider *ngIf="data.mode === 'edit' && data.task" class="subtask-divider"></mat-divider>
  <app-subtask-list *ngIf="data.mode === 'edit' && data.task" [taskId]="data.task.myTaskId"></app-subtask-list>

  <!-- Calendar Events Section (only shown in edit mode) -->
  <mat-divider *ngIf="data.mode === 'edit' && data.task" class="calendar-event-divider"></mat-divider>
  <app-calendar-event-list *ngIf="data.mode === 'edit' && data.task" [taskId]="data.task.myTaskId"></app-calendar-event-list>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid || loading">
    <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
    <span *ngIf="!loading">{{ data.mode === 'create' ? 'Create' : 'Save' }}</span>
  </button>
</mat-dialog-actions>
