<div class="milestone-container">
  <div class="milestone-header">
    <button mat-raised-button color="primary" (click)="openCreateDialog()" matTooltip="Create new milestone" class="add-btn">
      <mat-icon>add</mat-icon>
      Add
    </button>
  </div>

  <div class="export-buttons">
    <button mat-stroked-button (click)="exportAs('json')" matTooltip="Download as JSON" class="export-btn">
      <mat-icon>download</mat-icon>
      JSON
    </button>
    <button mat-stroked-button (click)="exportAs('xml')" matTooltip="Download as XML" class="export-btn">
      <mat-icon>download</mat-icon>
      XML
    </button>
    <button mat-stroked-button (click)="exportAs('ical')" matTooltip="Download as iCal" class="export-btn">
      <mat-icon>download</mat-icon>
      iCal
    </button>
  </div>

  <div *ngIf="loading()" class="loading">
    <p>Loading milestones...</p>
  </div>

  <div *ngIf="!loading() && milestones().length === 0" class="no-data">
    <p>No milestones yet</p>
  </div>

  <table mat-table [dataSource]="milestones()" *ngIf="!loading() && milestones().length > 0" class="milestone-table">
    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let element">{{ element.title }}</td>
    </ng-container>

    <!-- Target Date Column -->
    <ng-container matColumnDef="targetDate">
      <th mat-header-cell *matHeaderCellDef>Target Date</th>
      <td mat-cell *matCellDef="let element">{{ formatDate(element.targetDate) }}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <mat-chip [color]="getStatusColor(element.status)" selected>
          {{ element.status }}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="editMilestone(element)" matTooltip="Edit">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteMilestone(element)" matTooltip="Delete">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
